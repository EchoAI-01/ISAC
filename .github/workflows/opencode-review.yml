name: opencode-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  issues: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          EASTPOLESTAR_API_KEY: ${{ secrets.EASTPOLESTAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: eastpolestar/hy3
          use_github_token: true
          prompt: |
            你是一名资深代码审查员,正在审查这个 GitHub Pull Request。

            任务:
            1. 认真阅读 PR 的完整 diff 和相关上下文。
            2. 找出真实存在的问题,按严重度分级:
               - [BLOCKER] 阻断级:bug、安全问题、资源泄漏、明显逻辑错误、破坏现有功能
               - [SUGGEST] 建议级:可读性、性能、边界条件、错误处理、测试覆盖不足
               - [STYLE] 风格级:命名、格式、与现有代码风格不一致
            3. 每条意见格式:文件路径:行号 - 问题描述 - 具体修改建议
            4. 不要刷存在感:没有实质问题就明确说没有问题。不要重复 linter 能发现的问题。
            5. 最后输出审查总结与结论。