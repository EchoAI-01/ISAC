name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy isac/

      - name: Pytest
        # K8: branch coverage + 最低覆盖率门禁 (statement 75%, branch 45%)
        # 覆盖率下滑会阻止合并; 关键安全/启动路径 (K7/K1/K4) 已有专项测试
        run: uv run pytest --cov=isac --cov-branch --cov-report=term-missing --cov-fail-under=75

  catalog-drift:
    # U8 治理门禁: catalog 漂移检测 —— 工具面/配置键面/模型能力快照变更后未重新
    # 生成入库 catalog 即失败 (生成脚本见 scripts/gen_*_catalog.py 与
    # scripts/gen_model_capabilities.py)。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Tool catalog drift check
        run: uv run python scripts/gen_tool_catalog.py --check

      - name: Config catalog drift check
        run: uv run python scripts/gen_config_catalog.py --check

      - name: Model capabilities snapshot parse check
        run: uv run python scripts/gen_model_capabilities.py --check

      - name: Redline metrics check
        # U9: main.py 行数 / services 键数 / 硬编码门控词条目数 / 迁移棘轮, 只减不增
        run: uv run python scripts/check_redlines.py

  browser:
    # K8-2: Playwright 浏览器黄金路径测试 (tests/browser/); 未装时 skip,
    # CI 显式 install chromium 后跑。与 check/build/docker 并行, 失败不阻塞主链路。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Playwright chromium
        run: uv run playwright install chromium --with-deps

      - name: Run browser tests
        # tests/browser/ 未装 Playwright 时 skip; CI 显式装后应跑
        run: uv run pytest tests/browser/ -v

  build:
    # K8: 构建 wheel/sdist 并安装 smoke, 验证包可发布
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel and sdist
        run: uv build

      - name: Install from wheel
        run: |
          uv venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/python -m pip install dist/isac-*.whl
          /tmp/smoke-venv/bin/python -c "import isac; print(f'version={isac.__version__}')"

  docker:
    # K8: Docker build + 容器启动 + healthcheck smoke
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t isac:ci .

      - name: Run container and probe health
        run: |
          docker run -d --name isac-ci -p 8765:8765 \
            -e ISAC_CONTROL_ENABLED=true \
            -e ISAC_CONTROL_HOST=0.0.0.0 \
            -e ISAC_CONTROL_PORT=8765 \
            isac:ci
          # 等容器启动
          for i in {1..30}; do
            if curl -sf http://localhost:8765/health > /dev/null; then
              echo "health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "health check failed after 30s"
          docker logs isac-ci
          exit 1
        # 总是清理容器, 不论成功失败
      - name: Cleanup container
        if: always()
        run: docker rm -f isac-ci || true
