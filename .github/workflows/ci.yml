# ISAC CI — 提交级质量门禁
#
# 结构 (5 job 并行): check (lint/类型/测试+覆盖率) ‖ catalog-drift (U8 治理)
# ‖ browser (Playwright 黄金路径) → build (wheel 可安装性) / docker (镜像探活)。
# 发布流水线见 release.yml (tag v* 驱动, 门禁等价但独立复验)。
# 两边门禁改动请同步修改。

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# 最小权限; fork PR 同样只读
permissions:
  contents: read

# 同一分支/PR 的旧 run 直接取消, 不浪费 runner
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy isac/

      - name: Pytest
        # K8: branch coverage + 最低覆盖率门禁 (statement 75%, branch 45%)
        # 覆盖率下滑会阻止合并; 关键安全/启动路径 (K7/K1/K4) 已有专项测试
        # 2026-08-19 CI 修复: check job 未装 chromium, 排除 tests/browser (归 browser job
        # 专跑) —— 此前 testpaths 含 browser 致收集期 2 ERROR, check 恒败、build/docker
        # 因 needs: check 从未执行 (gh 核查 100/100 失败的结构性根因之一)。
        run: uv run pytest --ignore=tests/browser --cov=isac --cov-branch --cov-report=term-missing --cov-fail-under=75

  catalog-drift:
    # U8 治理门禁: catalog 漂移检测 —— 工具面/配置键面/模型能力快照变更后未重新
    # 生成入库 catalog 即失败 (生成脚本见 scripts/gen_*_catalog.py 与
    # scripts/gen_model_capabilities.py)。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Tool catalog drift check
        run: uv run python scripts/gen_tool_catalog.py --check

      - name: Config catalog drift check
        run: uv run python scripts/gen_config_catalog.py --check

      - name: Model capabilities snapshot parse check
        run: uv run python scripts/gen_model_capabilities.py --check

      - name: Redline metrics check
        # U9: main.py 行数 / services 键数 / 硬编码门控词条目数 / 迁移棘轮, 只减不增
        run: uv run python scripts/check_redlines.py

  browser:
    # K8-2: Playwright 浏览器黄金路径测试 (tests/browser/); 未装时 skip,
    # CI 显式 install chromium 后跑。与 check/build/docker 并行, 失败不阻塞主链路。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Playwright chromium
        run: uv run playwright install chromium --with-deps

      - name: Run browser tests
        # tests/browser/ 未装 Playwright 时 skip; CI 显式装后应跑
        run: uv run pytest tests/browser/ -v

  build:
    # K8: 构建 wheel/sdist 并安装 smoke, 验证包可发布
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Build wheel and sdist
        run: uv build

      - name: Install from wheel
        # 2026-10-10: uv venv 默认不装 pip (此前 `python -m pip` 必失败, build job
        # 自创建起从未通过); 改用 uv pip install 安装 wheel 并解析依赖。
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/isac-*.whl
          /tmp/smoke-venv/bin/python -c "import isac; print(f'version={isac.__version__}')"

      - name: Upload dist artifact
        # 供 PR 页面下载检查; 正式发布产物由 release.yml 重新构建并附到 GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  docker:
    # K8: Docker build + 容器启动 + healthcheck smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        # buildx + gha 后端缓存: uv sync 依赖层跨 run 复用, 显著提速
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: isac:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and probe health
        run: |
          docker run -d --name isac-ci -p 8765:8765 \
            -e ISAC_CONTROL_ENABLED=true \
            -e ISAC_CONTROL_HOST=0.0.0.0 \
            -e ISAC_CONTROL_ALLOW_EXTERNAL_HOST=true \
            -e ISAC_CONTROL_PORT=8765 \
            isac:ci
          # 等容器启动
          for i in {1..30}; do
            if curl -sf http://localhost:8765/health > /dev/null; then
              echo "health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "health check failed after 30s"
          docker logs isac-ci
          exit 1
        # 总是清理容器, 不论成功失败
      - name: Cleanup container
        if: always()
        run: docker rm -f isac-ci || true
